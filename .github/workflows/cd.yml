name: CD # Continuous Deployment

on:
  push:
    tags:
      - "[v]?[0-9]+.[0-9]+.[0-9]+"

jobs:
  publish:
    name: Publishing for ${{ matrix.job.os }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      matrix:
        rust: [stable]
        job:
          - os: macos-latest
            os-name: macos
            target: aarch64-apple-darwin
            architecture: arm64
            binary-postfix: ""
          - os: ubuntu-latest
            os-name: linux
            target: x86_64-unknown-linux-gnu
            architecture: x86_64
            binary-postfix: ""
          - os: ubuntu-latest
            os-name: linux
            target: aarch64-unknown-linux-gnu
            architecture: arm64
            binary-postfix: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          target: ${{ matrix.job.target }}
          profile: minimal
          override: true
      - uses: Swatinem/rust-cache@v2
      # Cross-compiling aarch64-unknown-linux-gnu via the `cross` tool pulls a
      # Docker image cross-rs deliberately bases on an old Ubuntu (GCC 5) for
      # wide glibc compatibility — too old to compile modern SIMD C code that
      # some dependencies (e.g. simsimd, pulled in by turso) require. Using
      # the runner's own apt cross-toolchain instead gives us a current GCC
      # with no container involved.
      - name: Install aarch64 cross toolchain
        if: matrix.job.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
      - name: Cargo build
        run: cargo build --release --target ${{ matrix.job.target }} --bins
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Packaging final binaries
        shell: bash
        run: |
          cd target/${{ matrix.job.target }}/release

          if [[ ${{ matrix.job.target }} == aarch64-unknown-linux-gnu ]]; then
            GCC_PREFIX="aarch64-linux-gnu-"
          else
            GCC_PREFIX=""
          fi

          for BINARY_NAME in nom-mcp nom-mcp-remote; do
            ####### reduce binary size by removing debug symbols #######
            "$GCC_PREFIX"strip ${BINARY_NAME}${{ matrix.job.binary-postfix }}

            ########## create tar.gz ##########
            RELEASE_NAME=${BINARY_NAME}-${GITHUB_REF/refs\/tags\//}-${{ matrix.job.os-name }}-${{ matrix.job.architecture }}
            tar czvf $RELEASE_NAME.tar.gz ${BINARY_NAME}${{ matrix.job.binary-postfix }}

            ########## create sha256 ##########
            shasum -a 256 $RELEASE_NAME.tar.gz > $RELEASE_NAME.sha256
          done

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v16
        with:
          name: jeffutter
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - run: nix build .#nom-mcp --accept-flake-config --option log-lines 200
      - run: nix build .#nom-mcp-remote --accept-flake-config --option log-lines 200
      - run: nix flake check --accept-flake-config

      - name: Releasing assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/${{ matrix.job.target }}/release/nom-mcp-*.tar.gz
            target/${{ matrix.job.target }}/release/nom-mcp-*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
