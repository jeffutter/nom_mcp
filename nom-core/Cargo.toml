[package]
name = "nom-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
bitflags = { version = "2.13.1", features = ["serde"] }
clap = "4.6.6"
config = { version = "0.15", default-features = false, features = ["toml"] }
http = "1"
rmcp = { version = "3.1.2", features = ["server", "client"] }
schemars = "1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = [
  "macros",
  "rt",
  "rt-multi-thread",
  "sync",
] }
turso = { version = "0.8.0-pre.4", default-features = false }
url = "2"
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "query",
] }
chrono = "0.4"
chrono-tz = "0.10"
iana-time-zone = "0.1"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "lock_holder"
path = "src/lock_holder.rs"
required-features = []

[dev-dependencies]
serial_test = "4"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
wiremock = "0.6"
