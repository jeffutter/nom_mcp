[package]
name = "nom-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
bitflags = { version = "2.13.1", features = ["serde"] }
clap = "4.6.6"
config = "0.14"
http = "1"
rmcp = { version = "2.2.0", features = ["server", "client"] }
schemars = "1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync"] }
tower-http = "0.7.0"
turso = "0.8.0-pre.4"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
chrono = "0.4"
chrono-tz = "0.9"
iana-time-zone = "0.1"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "lock_holder"
path = "src/lock_holder.rs"
required-features = []

[dev-dependencies]
serial_test = "3"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
wiremock = "0.6"
