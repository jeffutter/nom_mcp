[package]
name = "nom-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
config = "0.14"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
turso = "0.8.0-pre.4"

[dev-dependencies]
serial_test = "3"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
