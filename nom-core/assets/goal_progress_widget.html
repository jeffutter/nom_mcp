<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Goal Progress</title>
<style>
  :root {
    --bg: light-dark(#ffffff, #171717);
    --fg: light-dark(#171717, #fafafa);
    --fg-muted: light-dark(#6b6b6b, #a3a3a3);
    --border: light-dark(#e5e5e5, #333333);
    --track: light-dark(#eeeeee, #262626);
    --accent: light-dark(#2563eb, #60a5fa);
    --under: light-dark(#2563eb, #60a5fa);
    --met: light-dark(#16a34a, #4ade80);
    --over: light-dark(#dc2626, #f87171);
    --card-bg: light-dark(#ffffff, #1f1f1f);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-sans, var(--font));
  }

  body {
    padding: clamp(12px, 3vw, 20px);
  }

  /* Shared slim date header line (both variants). */
  .header {
    font-size: clamp(11px, 1.6vw, 14px);
    color: var(--fg-muted);
    margin: 0 0 clamp(6px, 1.2vw, 12px) 0;
    line-height: 1;
  }

  /* --- Compact variant: single row of rings ---
     Ring/text sizes scale with the widget's own render width (vw is scoped
     to this iframe's document, not the host page) via clamp(min, preferred,
     max): small and tight on a narrow embed, larger on a wide one, instead
     of a single pixel size that is either cramped or overflowing depending
     on the host. */

  .ring-row {
    display: flex;
    justify-content: space-between;
    gap: 4px;
  }

  .ring-seg {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .ring-wrap {
    position: relative;
    width: clamp(44px, 11vw, 72px);
    height: clamp(44px, 11vw, 72px);
  }

  .ring-wrap svg,
  .card-ring svg {
    display: block;
  }

  .ring-center {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(9px, 2.1vw, 14px);
    font-weight: 600;
    white-space: nowrap;
  }

  .ring-label {
    font-size: clamp(9px, 1.7vw, 12px);
    color: var(--fg-muted);
    margin-top: clamp(2px, 0.6vw, 6px);
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    line-height: 1;
  }

  /* SVG donut rings: track circle + status-colored fill circle.
     Both circles must opt out of the SVG default (solid black) fill, or the
     fill circle paints a solid disc over the donut hole. */
  .ring-track,
  .ring-fill {
    fill: none;
  }

  .ring-track { stroke: var(--track); }

  .ring-fill.status-under { stroke: var(--under); }
  .ring-fill.status-met { stroke: var(--met); }
  .ring-fill.status-over { stroke: var(--over); }

  /* Slim footer line: weight + fasting hours (hidden when both absent). */
  .footer {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 8px;
    font-size: clamp(10px, 1.5vw, 13px);
    color: var(--fg-muted);
    margin-top: clamp(7px, 1.5vw, 14px);
    padding-top: clamp(5px, 1.2vw, 10px);
    border-top: 1px solid var(--border);
    line-height: 1;
  }

  .footer strong {
    color: var(--fg);
    font-weight: 600;
  }

  .chip {
    font-size: clamp(9px, 1.3vw, 11px);
    font-weight: 600;
    text-transform: uppercase;
    padding: 2px 5px;
    border-radius: 3px;
    background: var(--track);
  }

  .chip.status-under { color: var(--under); }
  .chip.status-met { color: var(--met); }
  .chip.status-over { color: var(--over); }

  /* --- Expanded variant: 2-column card grid --- */

  .card-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
  }

  .card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    background: var(--card-bg);
    border-radius: 10px;
    padding: 10px 12px;
  }

  .card-text {
    min-width: 0;
  }

  .card-label {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.2;
  }

  .card-delta {
    font-size: 11px;
    color: var(--fg-muted);
    margin-top: 2px;
    line-height: 1.2;
  }

  .card-ring {
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
  }

  .placeholder {
    color: var(--fg-muted);
    font-size: 13px;
    padding: 12px 0;
  }
</style>
</head>
<body>
  <div id="app">
    <p class="placeholder">Waiting for goal progress data&hellip;</p>
  </div>

<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------------
  // Minimal JSON-RPC 2.0 over postMessage, per the MCP Apps spec's own
  // "you don't need an SDK to talk MCP with the host" reference snippet
  // (specification/2026-01-26/apps.mdx, "Transport Layer" section).
  // ---------------------------------------------------------------------

  var nextId = 1;
  var pending = {};

  window.addEventListener("message", function (event) {
    var data = event.data;
    if (!data || typeof data !== "object") return;

    if (data.id !== undefined && pending[data.id]) {
      var entry = pending[data.id];
      delete pending[data.id];
      if ("result" in data) {
        entry.resolve(data.result);
      } else if ("error" in data) {
        entry.reject(new Error((data.error && data.error.message) || "RPC error"));
      }
      return;
    }

    if (data.method) {
      var handlers = notificationHandlers[data.method];
      if (handlers) {
        handlers.forEach(function (h) { h(data.params || {}); });
      }
    }
  });

  function sendRequest(method, params) {
    var id = nextId++;
    return new Promise(function (resolve, reject) {
      pending[id] = { resolve: resolve, reject: reject };
      window.parent.postMessage({ jsonrpc: "2.0", id: id, method: method, params: params }, "*");
    });
  }

  function sendNotification(method, params) {
    window.parent.postMessage({ jsonrpc: "2.0", method: method, params: params }, "*");
  }

  var notificationHandlers = {};
  function onNotification(method, handler) {
    (notificationHandlers[method] = notificationHandlers[method] || []).push(handler);
  }

  // ---------------------------------------------------------------------
  // Rendering
  // ---------------------------------------------------------------------

  var appEl = document.getElementById("app");

  var NUTRIENTS = [
    { key: "calories", label: "Calories", unit: "" },
    { key: "protein_g", label: "Protein", unit: "g" },
    { key: "carbs_g", label: "Carbs", unit: "g" },
    { key: "fat_g", label: "Fat", unit: "g" },
    { key: "fiber_g", label: "Fiber", unit: "g" }
  ];

  function fmt(n) {
    if (n === undefined || n === null) return "";
    return Math.round(n * 10) / 10;
  }

  // Escapes a value for safe interpolation into innerHTML. Server-side
  // validation constrains fields like `date`, but the widget must not rely
  // on that alone since it cannot verify who produced the tool result it renders.
  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // Donut ring as inline SVG. `size` is only the drawing resolution (viewBox
  // + stroke proportions); the rendered size is set by CSS on the enclosing
  // .ring-wrap/.card-ring (width/height: 100% here lets it scale with that
  // container instead of being pinned to a device-specific pixel size). The
  // fill circle uses pathLength="100" so stroke-dasharray maps directly to a
  // percentage — no circumference math. fillPct null/undefined or <= 0 draws
  // only the neutral track; values over 100 cap the arc at a full ring (the
  // true number still shows in text).
  function ringSvg(size, fillPct, cls) {
    var c = size / 2;
    var sw = Math.max(3, Math.round(size * 0.15));
    var r = c - sw / 2 - 0.5;
    var html = '<svg width="100%" height="100%" viewBox="0 0 ' + size + ' ' + size + '" aria-hidden="true">';
    html += '<circle class="ring-track" cx="' + c + '" cy="' + c + '" r="' + r + '" stroke-width="' + sw + '"/>';
    if (fillPct !== undefined && fillPct !== null && fillPct > 0) {
      var dash = Math.max(0, Math.min(100, fillPct));
      html += '<circle class="ring-fill ' + escapeHtml(cls) + '" cx="' + c + '" cy="' + c + '" r="' + r + '" ' +
        'pathLength="100" stroke-dasharray="' + dash + ' 100" stroke-linecap="round" ' +
        'transform="rotate(-90 ' + c + ' ' + c + ')" stroke-width="' + sw + '"/>';
    }
    html += "</svg>";
    return html;
  }

  // Text centered inside a compact ring: percent-of-goal when available,
  // otherwise the consumed value (covers no-target and zero-target cases).
  function centerText(p, unit) {
    p = p || {};
    if (p.percent !== undefined && p.percent !== null) {
      return Math.round(p.percent) + "%";
    }
    return fmt(p.consumed) + unit;
  }

  // Delta subtitle for expanded cards: "684 under" / "12 over" / "met".
  function deltaText(p, unit) {
    p = p || {};
    if (p.remaining === undefined || p.remaining === null) return "";
    if (Math.abs(p.remaining) < 1e-9) return "met";
    if (p.remaining > 0) return fmt(p.remaining) + unit + " under";
    return fmt(Math.abs(p.remaining)) + unit + " over";
  }

  // Slim footer line: weight (latest → target + status chip) and fasting
  // hours. Returns "" when both are absent so the line hides gracefully.
  function footerHtml(data) {
    var w = data.weight || {};
    var parts = [];
    var hasWeight =
      (w.latest_weight !== undefined && w.latest_weight !== null) ||
      (w.target_weight !== undefined && w.target_weight !== null);
    if (hasWeight) {
      var latest = w.latest_weight === undefined || w.latest_weight === null ? "—" : fmt(w.latest_weight);
      var target = w.target_weight === undefined || w.target_weight === null ? "—" : fmt(w.target_weight);
      var chip = w.status
        ? ' <span class="chip status-' + escapeHtml(w.status) + '">' + escapeHtml(w.status) + "</span>"
        : "";
      parts.push(
        "Wt <strong>" + escapeHtml(latest) + "</strong> &rarr; <strong>" + escapeHtml(target) + "</strong>" + chip
      );
    }
    if (data.fasting_hours !== undefined && data.fasting_hours !== null) {
      parts.push("Fasting " + fmt(data.fasting_hours) + "h");
    }
    if (!parts.length) return "";
    return '<div class="footer">' + parts.join("&nbsp;&middot;&nbsp;") + "</div>";
  }

  // Compact (default): slim date header, one row of five rings (percent of
  // goal centered inside each, nutrient label below), slim footer line.
  function renderCompact(data) {
    var html = '<p class="header">' + escapeHtml(data.date || "") + "</p>";
    html += '<div class="ring-row">';
    NUTRIENTS.forEach(function (n) {
      var p = data[n.key] || {};
      var fill = p.percent !== undefined && p.percent !== null ? p.percent : null;
      var status = p.status || "under";
      html +=
        '<div class="ring-seg">' +
          '<div class="ring-wrap">' +
            ringSvg(72, fill, "status-" + status) +
            '<span class="ring-center">' + escapeHtml(centerText(p, n.unit)) + "</span>" +
          "</div>" +
          '<span class="ring-label">' + escapeHtml(n.label) + "</span>" +
        "</div>";
    });
    html += "</div>";
    html += footerHtml(data);
    return html;
  }

  // Expanded: same date header, 2-column card grid of targeted nutrients
  // (bold label + delta subtitle left, status-colored ring right), shared
  // footer line. Nutrients without a target are skipped here.
  function renderExpanded(data) {
    var html = '<p class="header">' + escapeHtml(data.date || "") + "</p>";
    var cards = [];
    NUTRIENTS.forEach(function (n) {
      var p = data[n.key];
      if (!p || p.target === undefined || p.target === null) return;
      var fill = p.percent !== undefined && p.percent !== null ? p.percent : null;
      var status = p.status || "under";
      cards.push(
        '<div class="card">' +
          '<div class="card-text">' +
            '<div class="card-label">' + escapeHtml(n.label) + "</div>" +
            '<div class="card-delta">' + escapeHtml(deltaText(p, n.unit)) + "</div>" +
          "</div>" +
          '<div class="card-ring">' + ringSvg(40, fill, "status-" + status) + "</div>" +
        "</div>"
      );
    });
    if (cards.length) {
      html += '<div class="card-grid">' + cards.join("") + "</div>";
    } else {
      html += '<p class="placeholder">No goals set</p>';
    }
    html += footerHtml(data);
    return html;
  }

  function render(data) {
    appEl.innerHTML =
      data && data.variant === "expanded" ? renderExpanded(data) : renderCompact(data);
    reportSize();
  }

  function renderError(message) {
    appEl.innerHTML = '<p class="placeholder">' + escapeHtml(message) + "</p>";
  }

  function extractGoalProgress(toolResult) {
    if (!toolResult || !toolResult.content || !toolResult.content.length) return null;
    var block = toolResult.content[0];
    if (!block || typeof block.text !== "string") return null;
    try {
      return JSON.parse(block.text);
    } catch (e) {
      return null;
    }
  }

  // ---------------------------------------------------------------------
  // Theming: apply host-provided CSS variables/theme if present.
  // ---------------------------------------------------------------------

  function applyHostContext(ctx) {
    if (!ctx) return;
    if (ctx.theme === "light" || ctx.theme === "dark") {
      document.documentElement.style.colorScheme = ctx.theme;
    }
    if (ctx.styles && ctx.styles.variables) {
      Object.keys(ctx.styles.variables).forEach(function (key) {
        var value = ctx.styles.variables[key];
        if (value !== undefined && value !== null) {
          document.documentElement.style.setProperty(key, value);
        }
      });
    }
  }

  var lastSize = { width: 0, height: 0 };
  function reportSize() {
    var width = document.documentElement.scrollWidth;
    var height = document.documentElement.scrollHeight;
    if (width === lastSize.width && height === lastSize.height) return;
    lastSize = { width: width, height: height };
    sendNotification("ui/notifications/size-changed", { width: width, height: height });
  }

  if (typeof ResizeObserver !== "undefined") {
    new ResizeObserver(reportSize).observe(document.documentElement);
  }

  // ---------------------------------------------------------------------
  // Handshake + lifecycle
  // ---------------------------------------------------------------------

  onNotification("ui/notifications/tool-input", function () {
    // Arguments only; the rendered payload comes from tool-result.
  });

  onNotification("ui/notifications/tool-result", function (params) {
    var data = extractGoalProgress(params);
    if (data) {
      render(data);
    } else {
      renderError("Unable to read goal progress result.");
    }
  });

  onNotification("ui/notifications/tool-cancelled", function () {
    renderError("Tool call was cancelled.");
  });

  onNotification("ui/notifications/host-context-changed", function (ctx) {
    applyHostContext(ctx);
  });

  sendRequest("ui/initialize", {
    appCapabilities: {},
    appInfo: { name: "nom-mcp-goal-progress-widget", version: "1.0.0" },
    protocolVersion: "2026-01-26"
  }).then(function (result) {
    applyHostContext(result && result.hostContext);
    sendNotification("ui/notifications/initialized", {});
  }).catch(function (err) {
    renderError("Failed to initialize: " + err.message);
  });
})();
</script>
</body>
</html>
