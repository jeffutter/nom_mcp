<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Weekly Progress</title>
<style>
  :root {
    --bg: light-dark(#ffffff, #171717);
    --fg: light-dark(#171717, #fafafa);
    --fg-muted: light-dark(#6b6b6b, #a3a3a3);
    --border: light-dark(#e5e5e5, #333333);
    --track: light-dark(#eeeeee, #262626);
    --accent: light-dark(#2563eb, #60a5fa);
    --under: light-dark(#2563eb, #60a5fa);
    --met: light-dark(#16a34a, #4ade80);
    --over: light-dark(#dc2626, #f87171);
    /* Meal-type hues for the composition ribbon. A single-hue (violet)
       lightness ramp keeps the three types separable under colour-vision
       deficiency and away from the blue/green/red goal-status hues used on
       the bar directly above; gray is the legacy / unrecognized bucket. */
    --meal-breakfast: light-dark(#3b0764, #7c3aed);
    --meal-lunch:     light-dark(#7c3aed, #a78bfa);
    --meal-dinner:    light-dark(#c4b5fd, #ede9fe);
    --meal-none:      light-dark(#8f8f99, #71717a);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-sans, var(--font));
  }

  body {
    padding: 10px;
  }

  h1 {
    font-size: 14px;
    font-weight: 600;
    margin: 0 0 1px 0;
  }

  .subtitle {
    font-size: 11px;
    color: var(--fg-muted);
    margin: 0 0 8px 0;
  }

  .section-title {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--fg-muted);
    margin: 8px 0 4px 0;
    padding-top: 4px;
    border-top: 1px solid var(--border);
  }

  .section-title:first-of-type {
    margin-top: 0;
    padding-top: 0;
    border-top: none;
  }

  .chart {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
  }

  .bar {
    fill: var(--accent);
  }
  .bar.status-under { fill: var(--under); }
  .bar.status-met { fill: var(--met); }
  .bar.status-over { fill: var(--over); }

  /* Meal-type segments of the composition ribbon under each calorie bar.
     A hairline in the page colour draws the seams: at ~26x5 user units per
     day the lightness steps alone wash out, and the palest violet nearly fuses
     with the status bar above it in dark mode. */
  .meal-seg.seg-breakfast { fill: var(--meal-breakfast); }
  .meal-seg.seg-lunch     { fill: var(--meal-lunch); }
  .meal-seg.seg-dinner    { fill: var(--meal-dinner); }
  .meal-seg.seg-none      { fill: var(--meal-none); }

  .meal-seg {
    stroke: var(--bg);
    stroke-width: 0.75;
  }

  .bar-label {
    font-size: 10px;
    fill: var(--fg-muted);
    text-anchor: middle;
  }

  .goal-line {
    stroke: var(--fg-muted);
    stroke-width: 1;
    stroke-dasharray: 3 2;
  }

  .weight-line {
    fill: none;
    stroke: var(--accent);
    stroke-width: 2;
  }

  .weight-target-line {
    stroke: var(--fg-muted);
    stroke-width: 1;
    stroke-dasharray: 3 2;
  }

  .weight-point {
    fill: var(--accent);
  }

  .summary-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    margin-top: 6px;
  }

  .summary-row .label {
    color: var(--fg-muted);
  }

  .weight-status {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    padding: 1px 5px;
    border-radius: 4px;
    background: var(--track);
  }

  .weight-status.status-under { color: var(--under); }
  .weight-status.status-met { color: var(--met); }
  .weight-status.status-over { color: var(--over); }

  .placeholder {
    color: var(--fg-muted);
    font-size: 13px;
    padding: 12px 0;
  }
</style>
</head>
<body>
  <div id="app">
    <p class="placeholder">Waiting for weekly progress data&hellip;</p>
  </div>

<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------------
  // Minimal JSON-RPC 2.0 over postMessage, per the MCP Apps spec's own
  // "you don't need an SDK to talk MCP with the host" reference snippet
  // (specification/2026-01-26/apps.mdx, "Transport Layer" section).
  // ---------------------------------------------------------------------

  var nextId = 1;
  var pending = {};

  window.addEventListener("message", function (event) {
    var data = event.data;
    if (!data || typeof data !== "object") return;

    if (data.id !== undefined && pending[data.id]) {
      var entry = pending[data.id];
      delete pending[data.id];
      if ("result" in data) {
        entry.resolve(data.result);
      } else if ("error" in data) {
        entry.reject(new Error((data.error && data.error.message) || "RPC error"));
      }
      return;
    }

    if (data.method) {
      var handlers = notificationHandlers[data.method];
      if (handlers) {
        handlers.forEach(function (h) { h(data.params || {}); });
      }
    }
  });

  function sendRequest(method, params) {
    var id = nextId++;
    return new Promise(function (resolve, reject) {
      pending[id] = { resolve: resolve, reject: reject };
      window.parent.postMessage({ jsonrpc: "2.0", id: id, method: method, params: params }, "*");
    });
  }

  function sendNotification(method, params) {
    window.parent.postMessage({ jsonrpc: "2.0", method: method, params: params }, "*");
  }

  var notificationHandlers = {};
  function onNotification(method, handler) {
    (notificationHandlers[method] = notificationHandlers[method] || []).push(handler);
  }

  // ---------------------------------------------------------------------
  // Rendering
  // ---------------------------------------------------------------------

  var appEl = document.getElementById("app");
  var SVG_NS = "http://www.w3.org/2000/svg";

  function fmt(n) {
    if (n === undefined || n === null) return "";
    return Math.round(n * 10) / 10;
  }

  // Escapes a value for safe interpolation into innerHTML. Server-side
  // validation constrains fields like `date`, but the widget must not rely
  // on that alone since it cannot verify who produced the tool result it renders.
  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // Builds the full list of YYYY-MM-DD dates from start to end (inclusive).
  // `daily_totals` only carries rows for days with logged meals, so a
  // 7-day chart needs the gaps filled in as zero-calorie days.
  function dateRange(start, end) {
    var dates = [];
    var s = start.split("-").map(Number);
    var e = end.split("-").map(Number);
    var cur = Date.UTC(s[0], s[1] - 1, s[2]);
    var last = Date.UTC(e[0], e[1] - 1, e[2]);
    while (cur <= last) {
      var d = new Date(cur);
      dates.push(
        d.getUTCFullYear() + "-" +
        String(d.getUTCMonth() + 1).padStart(2, "0") + "-" +
        String(d.getUTCDate()).padStart(2, "0")
      );
      cur += 86400000;
    }
    return dates;
  }

  function dayLabel(dateStr) {
    var parts = dateStr.split("-").map(Number);
    var d = new Date(Date.UTC(parts[0], parts[1] - 1, parts[2]));
    return ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][d.getUTCDay()];
  }

  function caloriesStatus(consumed, target, direction) {
    if (target === undefined || target === null) return "";
    var dir = direction || "target";
    if (dir === "maximum") return consumed > target ? "over" : "under";
    if (dir === "minimum") return consumed < target ? "under" : "met";
    if (Math.abs(consumed - target) < 0.01) return "met";
    return consumed > target ? "over" : "under";
  }

  // The ribbon band sits between the bars and the day-of-week labels.
  var RIBBON_TOP = 58;
  var RIBBON_HEIGHT = 5;
  var MEAL_SEG_CLASS = {
    breakfast: "seg-breakfast",
    lunch: "seg-lunch",
    dinner: "seg-dinner"
  };

  function mealBucketName(mealType) {
    return typeof mealType === "string" && mealType ? mealType : "(none)";
  }

  // Buckets with calories to draw, in server order (breakfast, lunch, dinner,
  // then the legacy null bucket). Zero-calorie buckets are dropped so they
  // can't eat the minimum-sliver width of a real meal.
  function mealBuckets(day) {
    if (!day || !Array.isArray(day.by_meal_type)) return [];
    return day.by_meal_type.filter(function (b) {
      return b && typeof b.calories === "number" && b.calories > 0;
    });
  }

  // Tooltip wording for a day: the total, plus the meal-type split when there
  // is one. Carries the information for hosts without hover and for slivers
  // too thin to point at.
  function dayTooltip(dateStr, day, calories) {
    var text = dateStr + ": " + fmt(calories) + " cal";
    var buckets = mealBuckets(day);
    if (!buckets.length) return text;
    return text + " \u00b7 " + buckets.map(function (b) {
      return mealBucketName(b.meal_type) + " " + fmt(b.calories);
    }).join(" / ");
  }

  // Thin stacked band beneath a day's calorie bar: one segment per meal-type
  // bucket, left-to-right in server order, widths proportional to bucket
  // calories. A small meal is clamped up to a visible sliver instead of
  // vanishing, which would quietly break breakfast+lunch+dinner vs the day
  // total. Days with no buckets (absent from daily_totals) draw nothing.
  function mealRibbon(svg, day, x, barW, dateStr) {
    var buckets = mealBuckets(day);
    if (!buckets.length) return;

    var totalCalories = buckets.reduce(function (sum, b) { return sum + b.calories; }, 0);
    if (!(totalCalories > 0)) return;

    var minSliver = 1.5;
    var widths = buckets.map(function (b) {
      return barW * b.calories / totalCalories;
    });
    var fixedTotal = 0;
    var isFixed = widths.map(function (w) {
      if (w < minSliver) {
        fixedTotal += minSliver;
        return true;
      }
      return false;
    });
    var freeCalories = buckets.reduce(function (sum, b, i) {
      return isFixed[i] ? sum : sum + b.calories;
    }, 0);
    var remaining = barW - fixedTotal;
    // Guard against rounding pathologies: only redistribute while some segment
    // stayed unfixed and room is left for it; otherwise keep raw widths.
    if (freeCalories > 0 && remaining > 0) {
      widths = widths.map(function (w, i) {
        return isFixed[i] ? minSliver : remaining * buckets[i].calories / freeCalories;
      });
    }

    var offset = x;
    buckets.forEach(function (b, i) {
      var seg = document.createElementNS(SVG_NS, "rect");
      seg.setAttribute("class", "meal-seg " + (MEAL_SEG_CLASS[b.meal_type] || "seg-none"));
      seg.setAttribute("x", offset);
      seg.setAttribute("y", RIBBON_TOP);
      seg.setAttribute("width", widths[i]);
      seg.setAttribute("height", RIBBON_HEIGHT);
      var titleEl = document.createElementNS(SVG_NS, "title");
      titleEl.textContent = dateStr + " \u00b7 " + mealBucketName(b.meal_type) + ": " + fmt(b.calories) + " cal";
      seg.appendChild(titleEl);
      svg.appendChild(seg);
      offset += widths[i];
    });
  }

  function caloriesChartSvg(data) {
    // Height grows 72 -> 80 to make room for the ribbon band; padBottom grows
    // with it so chartH stays 52 and the calorie bars themselves don't move.
    var width = 320, height = 80;
    var padLeft = 8, padRight = 8, padTop = 4, padBottom = 24;
    var chartW = width - padLeft - padRight;
    var chartH = height - padTop - padBottom;

    var dates = dateRange(data.start_date, data.end_date);
    var byDate = {};
    (data.nutrients.daily_totals || []).forEach(function (d) { byDate[d.date] = d; });

    var calories = data.nutrients.calories || {};
    var target = calories.target;
    var direction = calories.direction;

    var values = dates.map(function (d) {
      return byDate[d] ? byDate[d].calories : 0;
    });
    var maxVal = Math.max.apply(null, values.concat(target || 0, 1));

    var n = dates.length;
    var slot = chartW / n;
    var barW = Math.max(4, slot * 0.6);

    var svg = document.createElementNS(SVG_NS, "svg");
    svg.setAttribute("class", "chart");
    svg.setAttribute("viewBox", "0 0 " + width + " " + height);

    if (target !== undefined && target !== null) {
      var y = padTop + chartH - (target / maxVal) * chartH;
      var line = document.createElementNS(SVG_NS, "line");
      line.setAttribute("class", "goal-line");
      line.setAttribute("x1", padLeft);
      line.setAttribute("x2", padLeft + chartW);
      line.setAttribute("y1", y);
      line.setAttribute("y2", y);
      svg.appendChild(line);
    }

    dates.forEach(function (d, i) {
      var v = values[i];
      var barH = maxVal > 0 ? (v / maxVal) * chartH : 0;
      var x = padLeft + i * slot + (slot - barW) / 2;
      var y = padTop + chartH - barH;

      var rect = document.createElementNS(SVG_NS, "rect");
      rect.setAttribute("class", "bar status-" + caloriesStatus(v, target, direction));
      rect.setAttribute("x", x);
      rect.setAttribute("y", y);
      rect.setAttribute("width", barW);
      // Zero-calorie days render nothing (nothing was logged); any other
      // day gets at least a 1px bar so its <title> tooltip stays hoverable.
      rect.setAttribute("height", v > 0 ? Math.max(1, barH) : 0);
      var titleEl = document.createElementNS(SVG_NS, "title");
      titleEl.textContent = dayTooltip(d, byDate[d], v);
      rect.appendChild(titleEl);
      svg.appendChild(rect);

      mealRibbon(svg, byDate[d], x, barW, d);

      var label = document.createElementNS(SVG_NS, "text");
      label.setAttribute("class", "bar-label");
      label.setAttribute("x", x + barW / 2);
      label.setAttribute("y", height - 4);
      label.textContent = dayLabel(d);
      svg.appendChild(label);
    });

    return svg;
  }

  function weightChartSvg(data) {
    var width = 320, height = 50;
    var padLeft = 8, padRight = 8, padTop = 4, padBottom = 4;
    var chartW = width - padLeft - padRight;
    var chartH = height - padTop - padBottom;

    var weight = data.weight || {};
    var points = [];
    if (weight.start_weight !== undefined && weight.start_weight !== null) {
      points.push(weight.start_weight);
    }
    if (
      weight.end_weight !== undefined && weight.end_weight !== null &&
      weight.end_weight !== weight.start_weight
    ) {
      points.push(weight.end_weight);
    }

    var svg = document.createElementNS(SVG_NS, "svg");
    svg.setAttribute("class", "chart");
    svg.setAttribute("viewBox", "0 0 " + width + " " + height);

    if (points.length < 1) return svg;

    var target = weight.target_weight;
    var all = points.concat(target !== undefined && target !== null ? [target] : []);
    var minVal = Math.min.apply(null, all);
    var maxVal = Math.max.apply(null, all);
    if (minVal === maxVal) { minVal -= 1; maxVal += 1; }

    function yFor(v) {
      return padTop + chartH - ((v - minVal) / (maxVal - minVal)) * chartH;
    }

    if (target !== undefined && target !== null) {
      var line = document.createElementNS(SVG_NS, "line");
      line.setAttribute("class", "weight-target-line");
      line.setAttribute("x1", padLeft);
      line.setAttribute("x2", padLeft + chartW);
      line.setAttribute("y1", yFor(target));
      line.setAttribute("y2", yFor(target));
      svg.appendChild(line);
    }

    if (points.length === 1) {
      var cx = padLeft + chartW / 2;
      var circle = document.createElementNS(SVG_NS, "circle");
      circle.setAttribute("class", "weight-point");
      circle.setAttribute("cx", cx);
      circle.setAttribute("cy", yFor(points[0]));
      circle.setAttribute("r", 3);
      svg.appendChild(circle);
      return svg;
    }

    var step = chartW / (points.length - 1);
    var pathD = points.map(function (v, i) {
      return (i === 0 ? "M" : "L") + (padLeft + i * step) + "," + yFor(v);
    }).join(" ");

    var path = document.createElementNS(SVG_NS, "path");
    path.setAttribute("class", "weight-line");
    path.setAttribute("d", pathD);
    svg.appendChild(path);

    points.forEach(function (v, i) {
      var circle = document.createElementNS(SVG_NS, "circle");
      circle.setAttribute("class", "weight-point");
      circle.setAttribute("cx", padLeft + i * step);
      circle.setAttribute("cy", yFor(v));
      circle.setAttribute("r", 3);
      svg.appendChild(circle);
    });

    return svg;
  }

  function weightSummaryHtml(w) {
    w = w || {};
    if (w.start_weight === undefined && w.end_weight === undefined && w.latest_known_weight === undefined) {
      return '<p class="placeholder">No weight data</p>';
    }
    var parts = [];
    if (w.start_weight !== undefined && w.start_weight !== null) {
      parts.push('<span class="label">Start:</span> <strong>' + fmt(w.start_weight) + '</strong>');
    }
    if (w.end_weight !== undefined && w.end_weight !== null) {
      parts.push('<span class="label">End:</span> <strong>' + fmt(w.end_weight) + '</strong>');
    }
    if (w.delta !== undefined && w.delta !== null) {
      var sign = w.delta > 0 ? "+" : "";
      parts.push('<span class="label">Δ:</span> <strong>' + sign + fmt(w.delta) + '</strong>');
    }
    var statusHtml = w.status
      ? '<span class="weight-status status-' + w.status + '">' + w.status + '</span>'
      : "";
    return '<div class="summary-row">' + parts.join(' &nbsp; ') + statusHtml + '</div>';
  }

  function render(data) {
    var html = "<h1>Weekly Progress</h1>";
    html += '<p class="subtitle">' + escapeHtml(data.start_date || "") + " – " + escapeHtml(data.end_date || "") + "</p>";
    html += '<div class="section-title">Calories</div>';
    appEl.innerHTML = html;
    appEl.appendChild(caloriesChartSvg(data));

    var weightSection = document.createElement("div");
    weightSection.innerHTML = '<div class="section-title">Weight</div>';
    appEl.appendChild(weightSection);
    appEl.appendChild(weightChartSvg(data));

    var summary = document.createElement("div");
    summary.innerHTML = weightSummaryHtml(data.weight);
    appEl.appendChild(summary);

    reportSize();
  }

  function renderError(message) {
    appEl.innerHTML = '<p class="placeholder">' + escapeHtml(message) + "</p>";
  }

  function extractWeeklyProgress(toolResult) {
    if (!toolResult || !toolResult.content || !toolResult.content.length) return null;
    var block = toolResult.content[0];
    if (!block || typeof block.text !== "string") return null;
    try {
      return JSON.parse(block.text);
    } catch (e) {
      return null;
    }
  }

  // ---------------------------------------------------------------------
  // Theming: apply host-provided CSS variables/theme if present.
  // ---------------------------------------------------------------------

  function applyHostContext(ctx) {
    if (!ctx) return;
    if (ctx.theme === "light" || ctx.theme === "dark") {
      document.documentElement.style.colorScheme = ctx.theme;
    }
    if (ctx.styles && ctx.styles.variables) {
      Object.keys(ctx.styles.variables).forEach(function (key) {
        var value = ctx.styles.variables[key];
        if (value !== undefined && value !== null) {
          document.documentElement.style.setProperty(key, value);
        }
      });
    }
  }

  var lastSize = { width: 0, height: 0 };
  function reportSize() {
    var width = document.documentElement.scrollWidth;
    var height = document.documentElement.scrollHeight;
    if (width === lastSize.width && height === lastSize.height) return;
    lastSize = { width: width, height: height };
    sendNotification("ui/notifications/size-changed", { width: width, height: height });
  }

  if (typeof ResizeObserver !== "undefined") {
    new ResizeObserver(reportSize).observe(document.documentElement);
  }

  // ---------------------------------------------------------------------
  // Handshake + lifecycle
  // ---------------------------------------------------------------------

  onNotification("ui/notifications/tool-input", function () {
    // Arguments only; the rendered payload comes from tool-result.
  });

  onNotification("ui/notifications/tool-result", function (params) {
    var data = extractWeeklyProgress(params);
    if (data) {
      render(data);
    } else {
      renderError("Unable to read weekly progress result.");
    }
  });

  onNotification("ui/notifications/tool-cancelled", function () {
    renderError("Tool call was cancelled.");
  });

  onNotification("ui/notifications/host-context-changed", function (ctx) {
    applyHostContext(ctx);
  });

  sendRequest("ui/initialize", {
    appCapabilities: {},
    appInfo: { name: "nom-mcp-weekly-progress-widget", version: "1.0.0" },
    protocolVersion: "2026-01-26"
  }).then(function (result) {
    applyHostContext(result && result.hostContext);
    sendNotification("ui/notifications/initialized", {});
  }).catch(function (err) {
    renderError("Failed to initialize: " + err.message);
  });
})();
</script>
</body>
</html>
