[package]
name = "nom-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "nom-mcp"
path = "src/main.rs"

[[bin]]
name = "nom-mcp-remote"
path = "src/bin/nom-mcp-remote.rs"

[dependencies]
axum = "0.8.9"
nom-core = { path = "../nom-core" }
reqwest = { version = "0.13", default-features = false, features = ["json", "blocking", "rustls"] }
rmcp = { version = "3.1.2", features = ["server", "transport-io", "transport-streamable-http-server"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "signal"] }
tokio-util = "0.7"
tracing = "0.1"
url = "2"

[dev-dependencies]
wiremock = "0.6"
serial_test = "4"
